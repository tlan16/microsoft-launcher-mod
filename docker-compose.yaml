---
name: microsoft-launcher-mod
services:
  app:
    # Use amd64 because Hopper is not yet supported on arm64
    platform: linux/amd64
    build:
      context: .
      args:
        - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      - ./out/:/app/out/
  ghidra:
    extends:
      service: app
    build:
      target: ghidra
  jadx:
    extends:
      service: app
    build:
      target: jadx