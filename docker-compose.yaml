---
name: microsoft-launcher-mod
services:
  app:
    # Use amd64 because Hopper is not yet supported on arm64
    platform: linux/amd64
    build:
      context: .
      args:
        - GITHUB_TOKEN=${GITHUB_TOKEN}
    environment:
      COPILOT_HOME: /app/out/copilot
      APK_SIGNING_DIR: /app/signing
    volumes:
      - ./out/:/app/out/
      - ./signing/:/app/signing/
  ghidra:
    extends:
      service: app
    build:
      target: ghidra
  jadx:
    extends:
      service: app
    build:
      target: jadx